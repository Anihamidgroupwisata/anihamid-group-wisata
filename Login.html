<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Login Portal | Anihamid Group Wisata</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: Arial, sans-serif;
      min-height: 100vh;
      color: white;
      background:
        radial-gradient(
          circle at top,
          #332600 0%,
          #151006 30%,
          #050505 75%
        );

      display: flex;
      flex-direction: column;
    }

    header {
      text-align: center;
      padding: 28px 20px;
      border-bottom: 1px solid #80641e;
    }

    .logo {
      color: #e0b52e;
      font-size: 30px;
      font-weight: bold;
      letter-spacing: 4px;
    }

    .company {
      color: #aaa;
      font-size: 12px;
      margin-top: 7px;
    }

    main {
      flex: 1;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 35px 20px;
    }

    .login-box {
      width: 100%;
      max-width: 430px;

      background: rgba(8, 8, 8, 0.94);

      border: 1px solid #9b7918;
      border-radius: 22px;

      padding: 32px 25px;

      box-shadow:
        0 20px 60px rgba(0, 0, 0, 0.55);
    }

    .login-box h1 {
      text-align: center;
      color: #e0b52e;
      font-size: 30px;
      margin-bottom: 10px;
    }

    .subtitle {
      text-align: center;
      color: #aaa;
      margin-bottom: 30px;
      line-height: 1.5;
    }

    label {
      display: block;
      margin-bottom: 8px;
      color: #eee;
    }

    input,
    select {
      width: 100%;
      padding: 15px;

      margin-bottom: 20px;

      border: 1px solid #444;
      border-radius: 12px;

      background: #151515;
      color: white;

      font-size: 16px;
      outline: none;
    }

    input:focus,
    select:focus {
      border-color: #d4af37;
    }

    .remember {
      display: flex;
      align-items: center;
      gap: 10px;

      color: #aaa;
      margin-bottom: 25px;
    }

    .remember input {
      width: auto;
      margin: 0;
    }

    .login-button {
      display: block;

      width: 100%;
      padding: 16px;

      text-align: center;
      text-decoration: none;

      color: #111;
      font-weight: bold;
      font-size: 16px;

      background:
        linear-gradient(
          180deg,
          #f2cc52,
          #c99713
        );

      border: 1px solid #f1cc55;
      border-radius: 12px;

      cursor: pointer;
    }

    .login-button:hover {
      opacity: 0.9;
    }

    .help {
      text-align: center;
      margin-top: 25px;
      color: #999;
    }

    .help a {
      color: #d4af37;
      text-decoration: none;
    }

    .notice {
      margin-top: 20px;

      padding: 12px;

      border: 1px solid #554511;
      border-radius: 10px;

      background: rgba(212, 175, 55, 0.06);

      color: #aaa;
      font-size: 12px;
      line-height: 1.5;
      text-align: center;
    }

    footer {
      text-align: center;
      padding: 25px;

      color: #666;
      font-size: 11px;
    }
  </style>
</head>

<body>

  <header>
    <div class="logo">
      ANIHAMID
    </div>

    <div class="company">
      PT. ANIHAMID GROUP WISATA
    </div>
  </header>


  <main>

    <div class="login-box">

      <h1>Login Portal</h1>

      <p class="subtitle">
        Silakan masuk untuk mengakses sistem
      </p>


      <label for="username">
        Email / Username
      </label>

      <input
        type="text"
        id="username"
        placeholder="Masukkan email atau username"
      >


      <label for="password">
        Password
      </label>

      <input
        type="password"
        id="password"
        placeholder="Masukkan password"
      >


      <label for="role">
        Peran
      </label>

      <select id="role">

        <option value="">
          Pilih Peran
        </option>

        <option value="jamaah">
          Jamaah
        </option>

        <option value="agen">
          Agen
        </option>

        <option value="tourleader">
          Tour Leader
        </option>

        <option value="admin">
          Admin Travel
        </option>

        <option value="manajemen">
          Manajemen
        </option>

      </select>


      <div class="remember">

        <input
          type="checkbox"
          id="remember"
        >

        <span>
          Ingat saya
        </span>

      </div>


      <a
        href="dashboard.html"
        class="login-button"
      >
        LOGIN
      </a>


      <div class="notice">
        Untuk sementara tombol LOGIN dapat langsung digunakan
        tanpa memasukkan email dan password.
      </div>


      <div class="help">
        Belum punya akun?
        <a href="#">
          Hubungi Admin
        </a>
      </div>

    </div>

  </main>


  <footer>
    © 2026 PT. ANIHAMID GROUP WISATA
  </footer>

</body>
</html>
